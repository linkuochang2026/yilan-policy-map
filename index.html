<style>
/* Layout concept: a campaign poster that happens to be a map.
   Deep-ocean blue everywhere, one colour block per township, a lime accent for anything you can act on.
   Left: the live map. Right: a tall poster panel with huge numerals for the policies. */
:root{
  --ink:#0A1D38; --ink2:#102B4D; --ink3:#173A66; --edge:#2A4A72; --txt:#F4F8FF; --mut:#9FB8DA;
  --lime:#9ADB7A; --coral:#FF6B57; --sea:#0B2A52; --nb:#143F70;
  --f-sans:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Source Han Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --f-num:"Big Shoulders Display","PingFang TC","Noto Sans TC",Impact,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--txt);font-family:var(--f-sans);font-size:calc(14.5px*var(--ps,1));line-height:1.6}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
h1,h2,h3,h4,p,ul{margin:0}ul{padding:0}
a{color:var(--lime)}
.app{height:100%;display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1fr);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.mapbox{position:relative;min-height:0;overflow:hidden;background:var(--sea);order:1}
.panel{order:2;display:flex;flex-direction:column;min-height:0;background:var(--ink);border-left:3px solid var(--lime);z-index:3}
.brand{position:relative;padding:12px max(18px,env(safe-area-inset-right,0px)) 6px 18px}
.brand h1{font-size:calc(28px*var(--ps,1));line-height:1.1;font-weight:900;letter-spacing:-.02em}
.brand h1 span{display:inline;margin-left:.3em;color:var(--lime)}
.brand p{font-size:calc(12.5px*var(--ps,1));color:var(--mut);margin-top:8px}
.ballot{display:inline-flex;align-items:center;gap:8px;margin-top:10px;border:2px solid var(--lime);border-radius:14px;padding:3px 14px 3px 12px;font-weight:900;font-size:calc(13px*var(--ps,1));color:var(--lime)}
.ballot b{font-family:var(--f-num);font-size:calc(22px*var(--ps,1));line-height:1;font-weight:900;color:var(--ink);background:var(--lime);border-radius:10px;min-width:1.6em;text-align:center;padding:0 8px}
.slogan{margin-top:8px;font-size:calc(17px*var(--ps,1));font-weight:900;color:#fff;letter-spacing:.04em}
.ballot.pending{border-style:dashed;color:var(--mut);border-color:var(--edge);font-weight:700}
.ballot.pending b{display:none}
.sticker{position:absolute;right:16px;top:16px;transform:rotate(5deg);background:var(--lime);color:var(--ink);border-radius:12px;padding:4px 10px;text-align:center;font-size:calc(10px*var(--ps,1));font-weight:700;line-height:1.15;box-shadow:0 3px 0 #5E9A47}
.sticker b{display:block;font-family:var(--f-num);font-size:calc(22px*var(--ps,1));font-weight:900;line-height:1}
.sbox{margin:10px 16px 6px;display:flex;align-items:center;gap:8px;border-radius:12px;background:var(--ink2);border:2px solid var(--edge);padding:1px 12px}
.sbox input{flex:1;border:0;background:none;padding:9px 0;font-size:calc(15px*var(--ps,1));min-width:0;color:var(--txt)}
.sbox input::placeholder{color:var(--mut)}
.sbox input:focus{outline:none}
.sbox:focus-within{border-color:var(--lime)}
.sbox svg{flex:none;color:var(--lime)}
.pbody{flex:1;min-height:0;overflow:auto;padding:0 0 30px;scrollbar-color:var(--edge) var(--ink)}
.sec{margin:18px 16px 8px;font-size:calc(13px*var(--ps,1));color:var(--lime);font-weight:900;letter-spacing:.14em}
.towns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 16px}
.tb{display:flex;justify-content:space-between;align-items:center;gap:4px;border:0;background:var(--tc);color:var(--ink);border-radius:10px;padding:7px 10px;font-size:calc(14px*var(--ps,1));font-weight:700;text-align:left;transition:transform .12s}
.tb:hover{transform:translateY(-2px) rotate(-1deg)}
.tb span{font-family:var(--f-num);font-size:calc(19px*var(--ps,1));font-weight:800;line-height:1}
.row{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ink3);background:none;padding:10px 16px;transition:background .12s}
.row:hover{background:var(--ink2)}
.row .ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink);font-size:calc(13px*var(--ps,1));font-weight:900;background:var(--cc)}
.row .t{font-size:calc(14.5px*var(--ps,1));line-height:1.45;font-weight:500}
.row small{display:block;color:var(--mut);font-size:calc(12px*var(--ps,1));font-weight:400}
.row .sw{flex:none;width:30px;height:0;border-top:5px solid;margin-top:12px;border-radius:3px}
.back{margin:10px 12px 0;border:0;background:none;color:var(--lime);padding:4px;font-size:calc(14px*var(--ps,1));font-weight:700}
.head{padding:4px 16px 10px}
.head .kind{font-size:calc(12.5px*var(--ps,1));color:var(--lime);font-weight:900;letter-spacing:.12em}
.head h2{font-size:calc(34px*var(--ps,1));font-weight:900;line-height:1.15;letter-spacing:-.01em}
.head .lede{color:var(--mut);font-size:calc(13.5px*var(--ps,1));margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 16px}
.stats div{background:var(--ink2);border-radius:12px;padding:8px 12px}
.stats .v{font-family:var(--f-num);font-size:calc(34px*var(--ps,1));font-weight:900;line-height:1;color:var(--lime)}
.stats .l{font-size:calc(12px*var(--ps,1));color:var(--mut)}
.pc{margin:12px 14px;padding:14px 16px;background:var(--ink2);border-radius:16px;border-left:7px solid var(--cc,var(--edge));transition:transform .15s,box-shadow .15s}
.pc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.pc header{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:calc(12px*var(--ps,1));color:var(--mut)}
.pc .dot{width:10px;height:10px;border-radius:50%;background:var(--cc)}
.pc h4{font-size:calc(19px*var(--ps,1));font-weight:900;line-height:1.35;margin-top:6px}
.pc p{font-size:calc(14px*var(--ps,1));color:var(--mut);margin-top:3px}
.kn{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-top:12px}
.kn div{background:var(--cc);color:var(--ink);border-radius:12px;padding:8px 11px}
.kn b{display:block;white-space:nowrap;font-family:var(--f-num);font-size:calc(34px*var(--ps,1));font-weight:900;line-height:1;letter-spacing:-.01em}
.kn span{font-size:calc(12px*var(--ps,1));font-weight:700;line-height:1.3;display:block;margin-top:2px}
.pc details{margin-top:10px}.pc summary{cursor:pointer;font-size:calc(13px*var(--ps,1));color:var(--lime);font-weight:700}
.pc ul{margin:6px 0 0;padding-left:18px;font-size:calc(14px*var(--ps,1))}.pc li{margin:4px 0}
.badge{font-size:calc(11px*var(--ps,1));padding:0 7px;border-radius:5px;border:1px solid var(--edge);color:var(--txt)}
.badge.bg{background:var(--ink3)}.badge.v0{border-style:dashed;border-color:#FFD23F;color:#FFD23F}
.box{margin-top:9px;padding:8px 11px;font-size:calc(13px*var(--ps,1));border-radius:10px;background:var(--ink3)}
.box b{color:var(--lime)}
.box.resp{background:#3A2A0F}.box.resp b{color:#FFD23F}
.src{margin-top:9px;font-size:calc(12.5px*var(--ps,1));display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mut)}
.go{margin-top:10px;border:0;background:var(--lime);color:var(--ink);border-radius:20px;padding:5px 16px;font-size:calc(13.5px*var(--ps,1));font-weight:900;box-shadow:0 3px 0 #5E9A47;transition:transform .1s,box-shadow .1s}
.go:hover{transform:translateY(1px);box-shadow:0 2px 0 #5E9A47}
.empty{padding:10px 16px;color:var(--mut)}
.about{margin:10px 16px;font-size:calc(13.5px*var(--ps,1));color:var(--mut)}.about li{margin:5px 0 5px 16px}
.persbtn{display:block;margin:10px 16px 2px;width:calc(100% - 32px);border:2px solid var(--lime);background:var(--ink2);color:var(--lime);border-radius:14px;padding:9px 12px;font-size:calc(15px*var(--ps,1));font-weight:900;transition:background .12s,transform .1s}
.persbtn:hover{background:var(--ink3);transform:translateY(-1px)}
.agebox{margin:0 16px;padding:10px 14px 20px;border-radius:14px;background:var(--ink2);position:sticky;top:0;z-index:3;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.agetop{font-size:calc(13px*var(--ps,1));color:var(--mut);display:flex;align-items:center;gap:6px}
.agetop input{accent-color:var(--lime);width:16px;height:16px}
.agev{display:flex;align-items:baseline;gap:6px;margin:4px 0 10px}
.agev b{font-family:var(--f-num);font-size:calc(56px*var(--ps,1));font-weight:900;line-height:1;color:var(--lime);min-width:2.2ch}
.agev span{font-size:calc(18px*var(--ps,1));font-weight:900}
.agev em{font-style:normal;margin-left:auto;background:var(--lime);color:var(--ink);border-radius:10px;padding:0 10px;font-weight:900;font-size:calc(14px*var(--ps,1))}
#pAge{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:8px;outline:none;margin:0;background:linear-gradient(90deg,#FF6FA5 0 6%,#FFD23F 6% 17%,#29C5E6 17% 39%,#7ED957 39% 64%,#FF9F43 64% 100%)}
#pAge::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:var(--lime);border:5px solid var(--ink);box-shadow:0 0 0 2px var(--lime),0 2px 6px rgba(0,0,0,.5);cursor:grab}
#pAge::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--lime);border:5px solid var(--ink);box-shadow:0 0 0 2px var(--lime);cursor:grab}
#pAge:focus-visible{outline:3px solid var(--lime);outline-offset:4px}
.ageticks{position:relative;height:16px;margin-top:6px;font-family:var(--f-num);font-size:calc(13px*var(--ps,1));color:var(--mut)}
.ageticks span{position:absolute;transform:translateX(-50%)}
.ageticks span:first-child{transform:none}.ageticks span:last-child{transform:translateX(-100%)}
.pjobs button[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.pall{display:block;margin:8px 16px 0;font-size:calc(14px*var(--ps,1));color:var(--mut)}
.sec small{font-weight:500;opacity:.8;margin-left:4px}
.prow{display:flex;gap:8px;align-items:center;margin:10px 16px 4px}
.prow .go{margin-top:0}
.btn2{border:2px solid var(--edge);background:none;border-radius:18px;padding:3px 14px;font-size:calc(13px*var(--ps,1));font-weight:700}
.row small.m{color:var(--lime);font-weight:700}
#presult .need{margin:8px 16px}
.aud{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px}
.aud button{display:flex;align-items:center;gap:6px;border:2px solid var(--edge);background:var(--ink2);border-radius:18px;padding:3px 11px;font-size:calc(13.5px*var(--ps,1));font-weight:700;transition:border-color .12s,transform .12s}
.aud button:hover{border-color:var(--lime);transform:translateY(-1px)}
.aud button span{font-family:var(--f-num);font-size:calc(16px*var(--ps,1));font-weight:800;color:var(--lime)}
.need{margin:0 16px 12px;padding:12px 14px;border-radius:14px;background:var(--ink2);border-left:6px solid var(--lime)}
.need b{display:block;font-size:calc(13px*var(--ps,1));color:var(--lime);letter-spacing:.1em;margin-bottom:2px}
.need p{font-size:calc(15px*var(--ps,1));line-height:1.6}
.need small{display:block;color:var(--mut);font-size:calc(12px*var(--ps,1));margin-top:6px}
.whos{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:10px;font-size:calc(12px*var(--ps,1));color:var(--mut)}
.who{border:1px solid var(--edge);background:none;border-radius:12px;padding:0 9px;font-size:calc(12px*var(--ps,1));font-weight:700;color:var(--txt)}
.who:hover{border-color:var(--lime);color:var(--lime)}
.tourbtn{display:block;margin:12px 16px 2px;width:calc(100% - 32px);border:0;border-radius:14px;background:var(--coral);color:#fff;padding:12px;font-size:calc(17px*var(--ps,1));font-weight:900;box-shadow:0 4px 0 #B8402F;transition:transform .1s,box-shadow .1s}
.tourbtn:hover{transform:translateY(2px);box-shadow:0 2px 0 #B8402F}
.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 16px}
.wall button{border:0;border-radius:14px;padding:9px 12px;text-align:left;background:var(--cc);color:var(--ink);transition:transform .14s;min-width:0}
.wall button:nth-child(odd):hover{transform:rotate(-1.5deg) translateY(-2px)}
.wall button:nth-child(even):hover{transform:rotate(1.5deg) translateY(-2px)}
.wall b{display:block;white-space:nowrap;font-family:var(--f-num);font-size:calc(42px*var(--ps,1));line-height:.95;font-weight:900;letter-spacing:-.01em}
.wall span{font-size:calc(12.5px*var(--ps,1));font-weight:700;display:block;margin-top:3px;line-height:1.3}
/* map overlays */
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;--u:1;--rw:1;user-select:none}
#map.drag{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:calc(13px*var(--ps,1));font-weight:900;color:var(--ink);background:rgba(255,255,255,.88);border-radius:9px;padding:0 7px;line-height:20px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.lb b{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--ink);color:var(--lime);font-family:var(--f-num);font-size:calc(14px*var(--ps,1));font-weight:800;margin-left:5px;vertical-align:-1px}
.lb.sel{background:var(--lime);font-size:calc(15px*var(--ps,1));box-shadow:0 0 0 3px var(--ink)}
.lb.sh{font-size:calc(11px*var(--ps,1));font-weight:900;padding:0 6px;border-radius:5px;background:var(--ink);color:#fff;box-shadow:none;border:2px solid #fff;line-height:15px}
.lb.sh.n5{background:#5E9A47}.lb.sh.t62,.lb.sh.hsr{background:#7C3AED}.lb.sh.tra{background:#1F5FA6}
.lb.pn{transform:translate(-50%,-100%);font-size:calc(12.5px*var(--ps,1));background:var(--ink);color:#fff}
.chips{position:absolute;left:12px;right:12px;top:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:flex;align-items:center;gap:6px;border:0;background:var(--cc);color:var(--ink);border-radius:18px;padding:4px 13px;font-size:calc(13.5px*var(--ps,1));font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.35);transition:opacity .15s,transform .1s}
.chips button[aria-pressed="false"]{opacity:.35;box-shadow:none;transform:scale(.96)}
.zoom{position:absolute;right:12px;bottom:30px;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.zoom button{border:0;background:var(--ink);color:var(--lime);width:42px;height:42px;font-size:calc(22px*var(--ps,1));font-weight:700}
.zoom button+button{border-top:1px solid var(--ink3)}
.zoom button:hover{background:var(--ink2)}
.tools{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:6}
.tools button{border:0;background:var(--ink);color:var(--txt);border-radius:10px;padding:6px 13px;font-size:calc(13px*var(--ps,1));font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tools button[aria-pressed="false"]{opacity:.6}
.legend{position:absolute;right:64px;bottom:12px;background:rgba(10,29,56,.86);color:var(--mut);border-radius:10px;padding:4px 11px;font-size:calc(11.5px*var(--ps,1));display:flex;gap:4px 12px;flex-wrap:wrap;max-width:58%}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px;border-radius:2px}
.attr{position:absolute;right:64px;bottom:44px;font-size:calc(10.5px*var(--ps,1));color:var(--mut);background:rgba(10,29,56,.7);padding:0 7px;border-radius:4px}
.tip{position:absolute;pointer-events:none;background:var(--lime);color:var(--ink);padding:3px 10px;border-radius:8px;font-size:calc(12.5px*var(--ps,1));font-weight:900;display:none;white-space:nowrap;z-index:5}
.tour{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(470px,calc(100% - 24px));background:var(--ink);border:3px solid var(--lime);border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.5);padding:12px 16px;z-index:6;display:none}
.tour .st{font-size:calc(12px*var(--ps,1));color:var(--lime);font-weight:900;letter-spacing:.1em}
.tour h3{font-size:calc(24px*var(--ps,1));font-weight:900;margin:2px 0;line-height:1.2}
.tour p{font-size:calc(14px*var(--ps,1));color:var(--mut)}
.tour .ctl{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-top:10px}
.tour .ctl button{border:2px solid var(--edge);background:none;border-radius:16px;padding:2px 13px;font-size:calc(13.5px*var(--ps,1));font-weight:700;white-space:nowrap}
.tour .ctl button:disabled{opacity:.35}
.tour .ctl .next{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.tour .pg{position:absolute;left:0;bottom:0;height:5px;width:100%;background:var(--lime);transform-origin:left;transform:scaleX(0);animation:tourpg 6000ms linear forwards;border-radius:0 0 15px 15px}
@keyframes tourpg{to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){.tour .pg{animation:none;transform:scaleX(1);opacity:.5}}
.tour .dots{display:flex;gap:4px;margin-left:auto}
.tour .dots i{width:7px;height:7px;border-radius:50%;background:var(--edge)}
.tour .dots i.on{background:var(--lime)}
/* svg map */
#map .land{stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke}
#map .nb{fill:var(--nb);stroke:none}
#map .forest{display:none}
#map .water{fill:var(--sea);stroke:none}
#map .river{fill:none;stroke:var(--sea);stroke-linecap:round;stroke-width:calc(1.4px*var(--rw));vector-effect:non-scaling-stroke}

.row .ic,.fzcat{color:#15352B}
#mego{color:#fff}
/* v106 poster-cover theme (red/gold albums) */
/* C: 白底 + 暖灰紙面 + 黃綠（Firefly） */
:root{--ink:#FFFFFF;--ink2:#F6F5EF;--surface:#F6F5EF;--ink3:#EEEDE4;--tint:#EEEDE4;--line:#E6E5DC;--edge:#CFCEC2;--txt:#1B1B18;--mut:#62635A;--lime:#55691A;--acc:#D9EE3F;--acc-ink:#1B1B18;--hero-bg:#F6F5EF;--hero-fg:#1B1B18;--hero-num:#1B1B18;--rad:999px;--rad-l:32px;--pill:999px;color-scheme:light}
.tb,.ab{border-color:transparent}
.ft,.ft.fday{border-color:transparent}
.qrow button{border-color:transparent}
.qrow button:first-child{border-color:var(--acc)}
/* v106 common: token-driven, one accent, no pastel rainbow, no hard shadows; desktop = wide */
body{background:var(--ink);color:var(--txt)}
:focus-visible{outline-color:var(--lime)}
a{color:var(--lime)}
/* hero */
.brand{background:var(--hero-bg);color:var(--hero-fg);border-radius:0;margin-bottom:0}
body .brand h1,body .brand h1 span,body.sub .brand h1{color:var(--hero-fg);text-shadow:none}
.brand h1 .c1,body.sub .brand h1 .c1{background:var(--acc);color:var(--acc-ink);box-shadow:none}
.brand .ballot{color:var(--hero-fg)}
.brand .ballot b{background:var(--acc);color:var(--acc-ink)}
.brand .slogan{display:none}
.brand .sticker{background:none;color:var(--mut);padding:0;border:0;border-radius:0;box-shadow:none;font-size:calc(12px*var(--ps,1))}
.brand .sticker b{color:var(--hero-num)}
.hbtns button{background:none;border:1.5px solid var(--edge);color:var(--hero-fg);border-radius:var(--pill)}
.hbtns button[aria-pressed="true"]{border-color:var(--hero-fg);background:var(--tint)}
.portrait{transform:none}
.portrait .pimg{border:0;border-radius:var(--rad-l);box-shadow:none}
.portrait .ptag{position:static;display:flex;gap:10px;align-items:baseline;max-width:none;background:none;color:var(--mut);border:0;box-shadow:none;transform:none;padding:12px 0 0}
.portrait .ptag b{font-size:calc(14px*var(--ps,1))}
/* body */
.sec{color:var(--txt);font-weight:800}
.sec small,.agh{color:var(--mut)}
.qrow button{background:var(--surface);border:1.5px solid var(--edge);border-radius:var(--rad);color:var(--txt)}
.qrow button:first-child{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.ft,.ft.fday{box-shadow:none;border-radius:var(--rad-l);color:var(--txt);background:var(--surface);border:1px solid var(--line)}
.ft svg{stroke:var(--txt)}
.ft.t1,.ft.t1.fday{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.ft.t1 svg{stroke:var(--acc-ink)}
.ft.t2,.ft.t3{background:var(--surface)}
.ft .fnew,.fnew{background:var(--txt);color:var(--ink);box-shadow:none}
.tb,.ab{background:var(--surface);border:1.5px solid var(--edge);color:var(--txt);border-radius:var(--rad)}
.tb:hover,.ab:hover{background:var(--tint)}
.ab[aria-pressed="true"],.tb[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.wall button{background:none;border:0;border-radius:0;border-left:1px solid var(--line);padding:0 0 0 24px;color:var(--txt)}
.wall button:first-child{border-left:0;padding-left:0}
.wall button{padding-right:16px}
.wall span{color:var(--mut)}
.kn div{background:var(--tint);color:var(--txt)}
.pcat{background:none;border:0;border-top:1px solid var(--line);border-radius:0;margin-bottom:0}
.pcat>summary i{background:var(--mut)}
.vd{background:none;border:0;border-top:1px solid var(--line);border-radius:0}
.vd>summary::after{color:var(--mut)}
.back{border:1px solid var(--line);background:var(--surface);box-shadow:none}
.qrow button,.fgrid button{background:var(--surface)}
#mebar{background:var(--surface);border-top:1px solid var(--line)}
#mego{background:var(--acc);color:var(--acc-ink)}
.foot{margin-top:56px}
.blk{display:block}
@media (min-width:700px) and (max-width:1023px){.app{max-width:760px}}
@media (min-width:1024px){
  .app{max-width:1360px;padding:0 56px}
  body.sub .app{max-width:920px}
  .panel{--ps:1.4}
  .brand{margin:0;box-shadow:0 0 0 100vmax var(--hero-bg);clip-path:inset(0 -100vmax);
    grid-template-columns:minmax(0,1fr) minmax(340px,460px);grid-template-areas:"h p" "s p" "x p" "b p" "g p";gap:20px 96px;align-content:center;padding:72px 0 80px}
  .brand h1{font-size:clamp(72px,7.8vw,118px);line-height:1.1;letter-spacing:-.01em}
  .brand .sticker{display:grid;font-size:calc(11px*var(--ps,1))}
  .brand .sticker b{font-size:calc(44px*var(--ps,1))}
  .hbtns{gap:12px}
  .hbtns button{min-height:48px;padding:0 24px}
  .portrait{width:100%;justify-self:end;margin:0}
  .portrait .pimg{aspect-ratio:1/1.08}
  body.sub .brand{grid-template-columns:1fr;grid-template-areas:"h" "x";padding:22px 0;gap:10px}
  body.sub .brand h1{font-size:30px}
  #pbody>*{margin-left:0;margin-right:0}
  .qrow{margin:44px 0 0;gap:20px}
  .qrow button{min-height:72px;font-size:calc(15px*var(--ps,1));text-align:left;padding:0 28px}
  .blk{display:grid;grid-template-columns:240px minmax(0,1fr);column-gap:64px;row-gap:0;padding:88px 0;border-top:1px solid var(--line)}
  .blk:first-of-type{border-top:0;padding-top:72px}
  .blk>.sec{grid-column:1;grid-row:1/span 40;align-self:start;position:sticky;top:32px;margin:0;font-size:calc(22px*var(--ps,1));line-height:1.25;font-weight:900}
  .blk>.sec small{display:block;margin:6px 0 0;font-size:calc(12px*var(--ps,1))}
  .blk>:not(.sec){grid-column:2}
  .blk .towns,.blk .audg,.blk .ftiles,.blk .vgrid,.blk .wall{padding:0}
  .blk .fun{margin:0}
  .agh{margin:0 0 14px;font-size:calc(13px*var(--ps,1))}
  .agh:not(:first-child){margin-top:36px}
  .ftiles{grid-template-columns:1.5fr 1fr 1fr;gap:20px}
  .ft,.ft.fday{min-height:220px;gap:16px;flex-direction:column;justify-content:center}
  .ft svg{width:60px;height:60px}
  .towns{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
  .tb{min-height:68px}
  .audg{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
  .ab{min-height:64px}
  .wall{grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
  .wall b{font-size:clamp(34px,3.4vw,56px)!important}
  .pcats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px;align-items:start}
  .vd{margin:0 0 14px}
  .vdesc{margin-left:0;margin-right:0}
  .foot{margin:0;padding:56px 0 72px;border-top:1px solid var(--line)}
  #mebar{left:50%;right:auto;transform:translateX(-50%);width:min(720px,calc(100% - 48px));bottom:20px;border:1px solid var(--line);border-radius:var(--rad-l);padding:12px 14px}
  body.hasbar .panel{padding-bottom:120px}
}
/* C2: more rhythm, still one accent: photo mosaic, countdown block, three different tiles, lime numbers band */
.ft.t2,.ft.t2.fday{background:#1B1B18;color:#fff}
.ft.t2 svg{stroke:var(--acc)}
@media (min-width:1024px){
  .brand .sticker{background:var(--acc);color:var(--acc-ink);padding:18px 32px 14px;border-radius:26px;justify-self:start}
  .brand .sticker b{color:var(--acc-ink);font-size:calc(52px*var(--ps,1))}
  .blk:nth-of-type(2){box-shadow:0 0 0 100vmax var(--surface);clip-path:inset(0 -100vmax);background:var(--surface);border-top:0}
  .blk:nth-of-type(2) .tb{background:#fff}
  .blk:nth-of-type(3){border-top:0}
  .blk:nth-of-type(4){box-shadow:0 0 0 100vmax var(--acc);clip-path:inset(0 -100vmax);background:var(--acc);border-top:0;color:var(--acc-ink)}
  .blk:nth-of-type(4)>.sec{color:var(--acc-ink)}
  .blk:nth-of-type(4) .wall button{border-left-color:rgba(27,27,24,.28);color:var(--acc-ink)}
  .blk:nth-of-type(4) .wall span{color:#2F3410}
  .blk:nth-of-type(5){border-top:0}
  .blk:nth-of-type(6){box-shadow:0 0 0 100vmax var(--surface);clip-path:inset(0 -100vmax);background:var(--surface);border-top:0}
}

@media (min-width:1024px){
  .pcats{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;grid-auto-flow:row dense}
  .pcats .pcat{background:var(--surface);border:0;border-radius:var(--rad-l);overflow:hidden}
  .pcats .pcat[open]{grid-column:1/-1;order:-0}
  .pcats .pcat>summary{flex-direction:column;align-items:flex-start;gap:18px;min-height:176px;padding:24px 24px 22px;justify-content:space-between}
  .pcats .pcat>summary::before{content:"";display:block;width:44px;height:44px;background:var(--txt);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
  .pcats .pcat>summary i{display:none}
  .pcats .pcat>summary::after{right:20px;top:24px;transform:none;color:var(--mut)}
  .pcats .pcat>summary b{font-size:calc(17px*var(--ps,1));line-height:1.3;display:block}
  .pcats .pcat>summary small{display:block;margin-top:4px}
  .pcats .pcat[open]>summary{min-height:0;flex-direction:row;align-items:center;gap:16px;padding:20px 24px}
  .pcats .pcat[open]>summary::before{width:36px;height:36px}
  .blk:nth-of-type(6){background:var(--ink);box-shadow:none;clip-path:none;border-top:0}
}
/* C5: accent only where it points, section titles above content */
.qrow button:first-child{background:var(--surface);border-color:var(--edge);color:var(--txt)}
.qrow button:first-child:hover{background:var(--tint)}
@media (min-width:1024px){
  .blk{display:block;padding:80px 0}
  .blk>.sec{position:static;margin:0 0 32px;font-size:calc(24px*var(--ps,1));line-height:1.2}
  .blk>.sec small{display:inline;margin:0 0 0 14px;font-size:calc(13px*var(--ps,1));font-weight:500}
  .blk>:not(.sec){grid-column:auto}
  .blk:nth-of-type(4){padding:64px 0}
  .ftiles{grid-template-columns:1.6fr 1fr 1fr}
  .ft,.ft.fday{min-height:240px}
  .towns{gap:14px}
  .tb{min-height:76px}
  .audg{gap:14px}
  .ab{min-height:70px}
  .wall b{font-size:clamp(40px,4.2vw,68px)!important}
  .pcats{grid-template-columns:repeat(4,minmax(0,1fr))}
}
/* fx: affordance, nav, clickable photos */
:root{--edge:#8A8B80}
.qrow button,.tb,.ab,.hbtns button{border:1.5px solid var(--edge)}
.topnav{display:none}
@media (min-width:1024px){
  body:not(.sub) .topnav{display:flex;gap:4px;position:sticky;top:0;z-index:40;padding:8px 0;background:#fff;box-shadow:0 0 0 100vmax #fff;clip-path:inset(0 -100vmax)}
  .topnav button{border:0;background:none;color:var(--txt);font-size:calc(14px*var(--ps,1));font-weight:700;padding:0 18px;border-radius:999px;min-height:44px}
  .topnav button:hover{background:var(--tint)}
  .blk{scroll-margin-top:64px}
}

/* v172: self-hosted subsets of the two display fonts (only the characters this site uses); Google Fonts stays as the fallback for anything outside the subset, e.g. names typed on the blessing card */
@font-face{font-family:"YLSerif";src:url(fonts/yl-serif.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"YLHand";src:url(fonts/yl-hand.woff2) format("woff2");font-weight:400;font-display:swap}
/* v107 poster-cover theme: red + gold, Noto Serif TC heavy titles, Iansui subtitles, albums as covers */
:root{--ink:#FFF6DA;--ink2:#FFFFFF;--surface:#FFFFFF;--ink3:#FBE9B6;--tint:#FBE9B6;--line:#E8D9A8;--edge:#8A7A4A;--txt:#1B1B18;--mut:#5C5646;--lime:#A63A35;--acc:#A63A35;--acc-ink:#FFFFFF;--hero-bg:#A63A35;--hero-fg:#FFFFFF;--hero-num:#E0C85C;--rad:10px;--rad-l:12px;--pill:999px;--red:#A63A35;--gold:#E0C85C;--serif:"YLSerif","Noto Serif TC","Noto Sans TC",serif;--hand:"YLHand","Iansui","Noto Sans TC",sans-serif}
body{background:var(--ink)}
/* hero */
.brand{background:var(--red);border-radius:0;border-bottom:10px solid var(--gold);margin-bottom:0}
body .brand h1,body .brand h1 span,body.sub .brand h1{font-family:var(--serif);font-weight:900;color:#fff}
.brand h1 .c1,body.sub .brand h1 .c1{background:var(--gold);color:var(--red);font-family:var(--serif)}
.brand .sticker{background:#1B1B18;color:var(--gold);border-radius:999px;padding:8px 22px}
.brand .sticker b{color:var(--gold)}
.brand .ballot{background:var(--gold);color:#1B1B18;border-radius:999px;padding:6px 18px;font-weight:900}
.brand .ballot b{background:var(--red);color:var(--gold)}
.hbtns button{color:#fff;border-color:rgba(255,255,255,.85);background:rgba(255,255,255,.08);font-weight:700}
.hbtns button[aria-pressed="true"]{background:rgba(255,255,255,.22);border-color:#fff}
.portrait .pimg{border:8px solid var(--gold);border-radius:0;box-shadow:none;background:#fff}
.portrait .ptag{background:#1B1B18;color:var(--gold);box-shadow:none;padding:6px 12px}
/* titles */
.sec{font-family:var(--serif);font-weight:900;color:var(--txt);border-left:10px solid var(--red);padding-left:16px;line-height:1.2}
.sec small{font-family:var(--hand);color:var(--mut);font-weight:400}
/* buttons + tiles */
.qrow button:first-child{background:var(--red);border-color:var(--red);color:#fff}
.qrow button{border-radius:8px}
.ft,.ft.fday{border-radius:8px;font-family:var(--serif)}
.ft.t1,.ft.t1.fday{background:var(--gold);border-color:var(--gold);color:#1B1B18}.ft.t1 svg{stroke:var(--red)}
.ft.t2,.ft.t2.fday{background:var(--red);border-color:var(--red);color:#fff}.ft.t2 svg{stroke:#fff}
.ft.t3,.ft.t3.fday{background:#1B1B18;border-color:#1B1B18;color:var(--gold)}.ft.t3 svg{stroke:var(--gold)}
.ft .fnew{background:#fff;color:var(--red)}
/* albums: towns and groups are covers */
.tb,.ab{position:relative;display:block;aspect-ratio:1;min-height:0!important;padding:0;overflow:hidden;border:0;border-radius:6px;text-align:left;container-type:inline-size;background:var(--cbg,#8A7560);color:var(--c1,#fff);box-shadow:0 8px 18px rgba(60,30,10,.22);transform:none!important}
.tb::before,.ab::before,.tb[aria-pressed="true"]::before,.ab[aria-pressed="true"]::before{content:"";position:absolute;inset:3.6cqw;border:.9cqw dotted var(--cfr,#fff);border-radius:3cqw;opacity:.8}
.tb:hover,.ab:hover{background:var(--cbg,#8A7560);filter:brightness(1.06)}
.tb .nm,.ab .nm{position:absolute;left:8cqw;top:8cqw;font-family:var(--serif);font-weight:900;color:var(--c1);z-index:1}
.nm.v{writing-mode:vertical-rl;text-orientation:upright;font-size:25cqw;line-height:1.02}
.nm.h{font-size:21cqw;line-height:1.1;white-space:nowrap}
.tb .sb,.ab .sb{position:absolute;right:7cqw;top:9cqw;writing-mode:vertical-rl;text-orientation:upright;font-family:var(--hand);font-size:7cqw;line-height:1.25;letter-spacing:.12em;color:var(--c2);max-height:72cqw;overflow:hidden;z-index:1}
.tb .ct,.ab .ct{position:absolute;right:7cqw;bottom:6cqw;font-family:var(--hand);font-size:8cqw;color:var(--c2);z-index:1}
.tb:nth-child(6n+1),.ab:nth-child(6n+1){--cbg:linear-gradient(160deg,#6B5645,#52433A);--c1:#F7B8E2;--c2:#FFE9F7;--cfr:#FFC2EE}
.tb:nth-child(6n+2),.ab:nth-child(6n+2){--cbg:linear-gradient(160deg,#BC4A40,#9C332E);--c1:#fff;--c2:#fff;--cfr:#fff}
.tb:nth-child(6n+3),.ab:nth-child(6n+3){--cbg:linear-gradient(160deg,#5D5A4C,#3F3C32);--c1:#F3EBD4;--c2:#F3EBD4;--cfr:#F3EBD4}
.tb:nth-child(6n+4),.ab:nth-child(6n+4){--cbg:linear-gradient(160deg,#8E2A33,#6E1B25);--c1:#E0C85C;--c2:#FFE9A8;--cfr:#E0C85C}
.tb:nth-child(6n+5),.ab:nth-child(6n+5){--cbg:linear-gradient(160deg,#E8D272,#D2B440);--c1:#7A221E;--c2:#1B1B18;--cfr:#A63A35}
.tb:nth-child(6n),.ab:nth-child(6n){--cbg:linear-gradient(160deg,#B9CC74,#8BA64A);--c1:#13331D;--c2:#13331D;--cfr:#13331D}
.tb[aria-pressed="true"],.ab[aria-pressed="true"]{background:var(--cbg);color:var(--c1);box-shadow:0 0 0 4px var(--ink),0 0 0 9px #1B1B18;font-weight:900}
.tb[aria-pressed="true"]::after,.ab[aria-pressed="true"]::after{content:"已選";position:absolute;right:0;top:0;background:#1B1B18;color:var(--gold);font:900 7cqw var(--hand);padding:2cqw 5cqw 2.4cqw;border-bottom-left-radius:2cqw;z-index:3}
.blk .tb,.blk:nth-of-type(2) .tb,.blk:nth-of-type(2) .tb:hover{background:var(--cbg)}
.towns,.audg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:600px){.towns{grid-template-columns:repeat(3,minmax(0,1fr))}.audg{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1024px){.towns{grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}.audg{grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}.tb,.ab{min-height:0}}
/* numbers: gold band on desktop */
.wall button{color:var(--txt)}
@media (min-width:1024px){
  .blk:nth-of-type(4){background:var(--gold);box-shadow:0 0 0 100vmax var(--gold);color:#1B1B18}
  .blk:nth-of-type(4)>.sec{color:#1B1B18;border-left-color:var(--red)}
  .blk:nth-of-type(4) .wall button{color:#1B1B18;border-left-color:rgba(27,27,24,.3)}
  .blk:nth-of-type(4) .wall span{color:#3a3410}
  .brand h1{font-size:clamp(76px,8vw,120px)}
}
.brand .ballot::before{content:"全民縣長";background:#1B1B18;color:#E0C85C;font-weight:900;padding:2px 14px;margin-right:6px}

/* v107 album viewer: pull a record off the shelf, slide the CD out, flip to the track list */
.tb,.ab{transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s}
.tb:hover,.ab:hover,.tb:focus-visible,.ab:focus-visible{transform:translateY(-8px)!important;box-shadow:0 16px 26px rgba(60,30,10,.3)}
body.albopen{overflow:hidden}
.albv{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .25s;font-family:var(--sans,"Noto Sans TC",sans-serif)}
.albv[hidden]{display:none}.albv.on{opacity:1}
.albv-bg{position:absolute;inset:0;background:rgba(27,27,24,.74)}
.albv-box{position:relative;display:grid;gap:26px;justify-items:center;max-width:100%}
.albv-stage{position:relative;width:min(64vw,440px);aspect-ratio:1;perspective:1500px;transform:translateY(34px) scale(.82);transition:transform .45s cubic-bezier(.22,1,.36,1)}
.albv.on .albv-stage{transform:translateX(-26%)}
.albv.on.is-back .albv-stage{transform:none}
.albv-disc{position:absolute;left:4%;top:4%;width:92%;aspect-ratio:1;z-index:1;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35));transition:transform .75s cubic-bezier(.22,1,.36,1) .12s}
.albv-disc svg{display:block;width:100%;height:100%}
.albv.on .albv-disc{transform:translateX(64%) rotate(220deg)}
.albv.on.is-back .albv-disc{transform:none}
.albv-flip{position:absolute;inset:0;z-index:2;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.22,1,.36,1)}
.albv.is-back .albv-flip{transform:rotateY(180deg)}
.albv-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;overflow:hidden;box-shadow:0 20px 44px rgba(0,0,0,.42)}
.albv-cover{background:var(--cbg);color:var(--c1);container-type:inline-size}
.albv-cover::before{content:"";position:absolute;inset:3.6cqw;border:.9cqw dotted var(--cfr);border-radius:3cqw;opacity:.8}
.albv-cover .nm{position:absolute;left:8cqw;top:8cqw;font-family:var(--serif);font-weight:900;color:var(--c1)}
.albv-cover .sb{position:absolute;right:7cqw;top:9cqw;writing-mode:vertical-rl;text-orientation:upright;font-family:var(--hand);font-size:7cqw;line-height:1.25;letter-spacing:.12em;color:var(--c2);max-height:72cqw;overflow:hidden}
.albv-cover .ct{position:absolute;right:7cqw;bottom:6cqw;font-family:var(--hand);font-size:8cqw;color:var(--c2)}
.albv-back{transform:rotateY(180deg);background:#FFF6DA;color:#1B1B18;padding:18px 18px 10px;display:flex;flex-direction:column}
.albv-back h3{margin:0;font:900 22px/1.2 var(--serif);border-left:8px solid var(--red);padding-left:12px}
.albv-back .tl{list-style:none;margin:10px 0 0;padding:0;overflow:auto;flex:1}
.trk{display:flex;gap:10px;width:100%;text-align:left;border:0;border-bottom:1.5px solid rgba(27,27,24,.25);background:none;padding:12px 4px;font:700 17px/1.4 var(--sans,"Noto Sans TC",sans-serif);color:inherit;cursor:pointer}
.trk b{font-family:var(--hand);font-weight:400;color:var(--red);min-width:30px}
.trk:hover,.trk:focus-visible{background:#F4E7B8}
.albv-back .none{padding:16px 4px;color:#5C5646}
.albv-acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.albv-b{min-height:52px;padding:0 24px;border-radius:8px;border:2px solid #FFF6DA;background:transparent;color:#FFF6DA;font:900 18px var(--sans,"Noto Sans TC",sans-serif);cursor:pointer}
.albv-b.pri{background:var(--gold);border-color:var(--gold);color:#1B1B18}
.albv-b.pri[aria-pressed="true"]{background:#FFF6DA;border-color:#FFF6DA}
.albv-b:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.tb,.ab,.albv,.albv-stage,.albv-disc,.albv-flip{transition:none!important}}

/* v108 phase 2: bag + jukebox */
.mebag{display:flex;align-items:center;gap:6px;font-weight:900;color:var(--txt);white-space:nowrap;font-size:calc(14px*var(--ps,1))}
.mebag svg{width:30px;height:35px;flex:none}
.mebag .n{display:grid;place-items:center;min-width:28px;height:28px;padding:0 7px;border-radius:999px;background:var(--red);color:#fff;font-size:15px}
.mebag .t{font-weight:700}
.mebag.bump{animation:bagbump .46s cubic-bezier(.34,1.56,.64,1)}
@keyframes bagbump{0%{transform:scale(1)}40%{transform:scale(1.32) rotate(-6deg)}100%{transform:scale(1)}}
body.albopen #mebar{z-index:95}
@media (max-width:420px){.mebag .t{display:none}}
.ft.t1,.ft.t1.fday{border-radius:120px 120px 8px 8px}

/* v109 phase 3: shop front, walk-in scroll, listening booth; fortune goes back to the tube */
.ft.t1,.ft.t1.fday{border-radius:8px}
.ft.t1 svg{stroke:var(--red)}
.brand{position:relative}
.brand::before{content:"";position:absolute;left:50%;top:0;width:100vw;height:22px;transform:translateX(-50%);background:repeating-linear-gradient(90deg,#8E2A33 0 44px,#F6EFD8 44px 88px);z-index:3}
.hcd{position:absolute;z-index:0;width:86%;aspect-ratio:1;left:-34%;top:7%;display:none}
.hcd svg{display:block;width:100%;height:100%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.portrait .pimg{position:relative;z-index:1}
@keyframes hspin{to{transform:rotate(360deg)}}
@media (min-width:700px){.hcd{display:block}.hcd svg{animation:hspin 14s linear infinite}}
/* listening booth */
.pdisc{display:grid;place-items:center;width:34%;aspect-ratio:1;border-radius:50%;position:relative;background:conic-gradient(from 30deg,#f4f8ff,#ffd9f0,#d9fff0,#fff6cc,#d9e4ff,#f4f8ff);box-shadow:inset 0 0 0 4px rgba(255,255,255,.55),0 6px 14px rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.22,1,.36,1)}
.pdisc::before{content:"";position:absolute;inset:14%;border-radius:50%;border:2px dotted rgba(166,58,53,.7)}
.pdisc::after{content:"";position:absolute;inset:30%;border-radius:50%;background:#A63A35}
.pdisc svg{position:relative;z-index:2;width:34%;height:auto;margin-left:6%}
.vmw>.pdisc{opacity:1}

  h+=p.bg?'':'<span class="badge">林國漳提出</span>';
  if(p.v===0)h+='<span class="badge v0" title="細節尚待確認">待確認</span>';
  h+='</header><h4>'+esc(p.t)+'</h4><p>'+esc(p.s)+'</p>';

  if(p.b.length)h+='<ul class="pb">'+p.b.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';

/* ================= persona: draggable age + job picker ================= */
var PS={age:35,ageOn:false,jobs:{},towns:{},allOn:true};
var AGE_BANDS=[['a_baby',0,6],['a_student',7,17],['a_youth',18,39],['a_adult',40,64],['a_senior',65,100]];
function ageGroup(a){for(var i=0;i<AGE_BANDS.length;i++)if(a>=AGE_BANDS[i][1]&&a<=AGE_BANDS[i][2])return AGE_BANDS[i][0];return 'a_senior'}
function personaIds(){var ids=[];if(PS.ageOn)ids.push(ageGroup(PS.age));Object.keys(PS.jobs).forEach(function(k){if(PS.jobs[k])ids.push(k)});return ids}
function personaTowns(){return Object.keys(PS.towns).filter(function(k){return PS.towns[k]})}
function personaMatches(){
  var ids=personaIds(),map={},tw=personaTowns();
  ids.forEach(function(aid){AI[aid].pol.forEach(function(pid){(map[pid]=map[pid]||[]).push(aid)})});
  var arr=Object.keys(map).map(function(pid){return {p:PBY[pid],a:map[pid]}}).filter(function(x){return match(x.p)});
  var here=function(p){return tw.some(function(t){return localTo(p,t)})};
  if(tw.length)arr=arr.filter(function(x){return here(x.p)||(PS.allOn&&x.p.tw==='all')});
  arr.forEach(function(x){x.loc=tw.length&&here(x.p)});
  arr.sort(function(x,y){return (y.loc?1:0)-(x.loc?1:0)||y.a.length-x.a.length||(x.p.bg?1:0)-(y.p.bg?1:0)||x.p.id.localeCompare(y.p.id)});
  var seen={};arr.forEach(function(x){seen[x.p.id]=1});
  var extra=tw.length?POL.filter(function(p){return !p.bg&&!seen[p.id]&&match(p)&&here(p)}):[];
  extra.forEach(function(p){seen[p.id]=1});
  var wide=(tw.length&&PS.allOn&&!ids.length)?POL.filter(function(p){return !p.bg&&p.tw==='all'&&!seen[p.id]&&match(p)}):[];
  return {ids:ids,arr:arr,extra:extra,wide:wide,tw:tw};
}

/* a 250 ms clock instead of one long timeout: survives throttled timers and shows the remaining seconds */
function startClock(){
  stopClock();
  if(!(TR.auto&&TR.i>=0&&TR.i<TL.length-1)){if(TR.i===TL.length-1)TR.auto=false;tourLabel();return}
  TR.left=STEP_MS;TR.last=Date.now();
  TR.clock=setInterval(function(){
    var now=Date.now(),dt=Math.min(now-TR.last,1000);TR.last=now;

}

    if(n===1){down={x:e.clientX,y:e.clientY,t:e.target};moved=0}
    if(n===2){var a=Object.keys(ptrs).map(function(k){return ptrs[k]});pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2};moved+=20}
  });

    var p=ptrs[e.pointerId];

    var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;var n=Object.keys(ptrs).length;
    if(n===1){moved+=Math.abs(dx)+Math.abs(dy);if(moved>5){map.classList.add('drag');V.cx-=dx*V.s;V.cy-=dy*V.s;clampV();applyV()}}

      zoomAt(mx,my,pinch.d/Math.max(10,d));V.cx-=(mx-pinch.mx)*V.s;V.cy-=(my-pinch.my)*V.s;pinch.d=d;pinch.mx=mx;pinch.my=my;clampV();applyV();
    }
  });
  function up(e){
    var one=Object.keys(ptrs).length===1;delete ptrs[e.pointerId];pinch=null;map.classList.remove('drag');

  }

  }
  function clickAt(e){

function wishLines(wish){
  if(WBRK[wish])return WBRK[wish];
  var parts=wish.split(/[，,、；;]/).filter(Boolean);
  if(parts.length>=2){
    var tot=parts.join('').length,best=1,bd=1e9,acc=0;
    for(var k=1;k<parts.length;k++){acc+=parts[k-1].length;var d=Math.abs(tot-2*acc);if(d<bd){bd=d;best=k}}
    return [parts.slice(0,best).join(''),parts.slice(best).join('')];
  }
  if(wish.length<=7)return [wish];
  var cuts=[];
  try{
    var sg=new Intl.Segmenter('zh-Hant',{granularity:'word'}),pos=0;
    Array.from(sg.segment(wish)).forEach(function(s){pos+=s.segment.length;if(pos<wish.length)cuts.push(pos)});
  }catch(e){}
  cuts=cuts.filter(function(p){return !/[0-9]/.test(wish.charAt(p-1))&&!/[0-9]/.test(wish.charAt(p))});
  var mid=wish.length/2,at=0,bd2=1e9;
  cuts.forEach(function(p){var d=Math.abs(p-mid);if(d<bd2){bd2=d;at=p}});
  if(!at||bd2>Math.max(2,wish.length*0.3))at=Math.ceil(mid);
  return [wish.slice(0,at),wish.slice(at)];
}

  var pb=document.getElementById('pbody');if(pb){heads();new MutationObserver(heads).observe(pb,{childList:true,subtree:true})}
  var last=null,was=null;
  document.addEventListener('click',function(e){var b=e.target.closest('button,a[href]');if(b&&!b.closest('#ov,#albv,.vmo'))last=b},true);
  function top(){var m=document.querySelector('.vmo');if(m)return m;var a=document.getElementById('albv');if(a&&!a.hidden)return a;return null}
  document.addEventListener('focusin',function(e){var m=top();if(m&&!m.contains(e.target)){var f=m.querySelector('button,a[href],input,video');if(f)f.focus()}});
  setInterval(function(){var m=top();if(was&&!m&&last&&document.contains(last)&&document.activeElement===document.body){try{last.focus()}catch(x){}}was=m},400);
})();
function mkStage(){var b=document.querySelector('.brand'),p=document.getElementById('portrait');if(!b||b.querySelector('.bulbs'))return;
  var bu=document.createElement('div');bu.className='bulbs';bu.setAttribute('aria-hidden','true');bu.innerHTML='<i></i><i></i>';b.appendChild(bu);
  if(p&&!p.querySelector('.spot')){var sp=document.createElement('div');sp.className='spot';sp.setAttribute('aria-hidden','true');p.appendChild(sp)}}
mkStage();
function mkCoverSw(){var p=$('#portrait');if(!p||p.querySelector('.covrow'))return;var img=p.querySelector('.pimg img'),b=p.querySelector('.mplaybtn');if(!img||!b)return;
  var opts=[['photos/album.jpg','專輯封面'],['photos/album2.jpg?v=4','年輕時的照片']],cur=0;try{cur=+localStorage.getItem('yl-cover')||0}catch(e){}
  var row=document.createElement('div');row.className='covrow';p.insertBefore(row,b);row.appendChild(b);
  var cb=document.createElement('button');cb.type='button';cb.className='covbtn';cb.textContent='換封面';p.appendChild(cb);
  function set(i){cur=i;img.src=opts[i][0];img.alt='林國漳 '+opts[i][1];cb.setAttribute('aria-label','換封面，目前是'+opts[i][1]);try{localStorage.setItem('yl-cover',String(i))}catch(e){}}
  cb.addEventListener('click',function(){set((cur+1)%opts.length)});
  set(cur);
}
mkCoverSw();
countdown();ballot();buildMap();buildShields();buildPins();buildChips();buildLegend();bind();
homeView(true);panel();paint();applyHash();window.addEventListener('hashchange',applyHash);
})();
</script>
<script>(function(){var ids=['s-play','s-rec','s-town','s-who','s-num','s-video','s-all'];function spy(){var y=window.innerHeight*.35,cur=null;ids.forEach(function(i){var e=document.getElementById(i);if(e&&e.getBoundingClientRect().top<=y)cur=i});Array.prototype.forEach.call(document.querySelectorAll('.topnav button[data-go]'),function(b){b.classList.toggle('cur',b.dataset.go===cur)})}window.addEventListener('scroll',spy,{passive:true});window.addEventListener('resize',spy);setTimeout(spy,600)})();
document.addEventListener('click',function(e){var b=e.target.closest('.topnav button[data-go]');if(!b)return;var t=document.getElementById(b.dataset.go);if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'})});</script>
